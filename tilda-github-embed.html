<div id="braapx-metal-animation"></div>
<style>
#braapx-metal-animation{width:100%;max-width:500px;aspect-ratio:1;margin:0 auto;background:transparent}
#braapx-metal-animation svg{display:block;width:100%;height:100%}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js"></script>
<script>
(function(){
var container=document.getElementById('braapx-metal-animation');
if(!container||container.dataset.initialized)return;
container.dataset.initialized='true';
var animation=lottie.loadAnimation({container:container,renderer:'svg',loop:true,autoplay:true,path:'https://raw.githubusercontent.com/stepachev/braapx-animation/main/braapx-metal-rotation.json',rendererSettings:{preserveAspectRatio:'xMidYMid meet'}});
animation.setSpeed(1);
animation.addEventListener('data_failed',function(){delete container.dataset.initialized;console.error('Не удалось загрузить анимацию Braapx');});
})();
</script>
